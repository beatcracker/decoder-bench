name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive

      - uses: jdx/mise-action@v4
        with:
          install: true

      - name: Cache dprint plugins
        uses: actions/cache@v6
        with:
          path: .local/dprint-cache
          key: dprint-${{ hashFiles('dprint.json', 'scripts/bench/dprint.json') }}

      - name: Cache webOS SDK
        uses: actions/cache@v6
        with:
          path: .local/webos-sdk
          key: webos-sdk-${{ runner.os }}-${{ hashFiles('scripts/toolchain/install-webos-sdk.sh') }}

      - name: Install host packages
        run: mise run host-setup -- --quiet

      - name: Install webOS SDK
        run: mise run sdk-install

      - name: Check
        run: mise run check

      - name: Package
        run: mise run package-webos

      - name: Verify test IPK
        shell: bash
        run: |
          shopt -s nullglob
          ipks=(build/webos/*.ipk)
          if (( ${#ipks[@]} != 1 )); then
            printf 'expected exactly one test IPK, found %d\n' "${#ipks[@]}" >&2
            exit 1
          fi

      - name: Upload test IPK
        uses: actions/upload-artifact@v7
        with:
          name: decoder-bench-webos-${{ github.sha }}
          path: build/webos/*.ipk
          if-no-files-found: error
