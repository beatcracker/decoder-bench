name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - uses: jdx/mise-action@v4
        with:
          install: true

      - name: Cache dprint plugins
        uses: actions/cache@v5
        with:
          path: .local/dprint-cache
          key: dprint-${{ hashFiles('dprint.json', 'scripts/bench/dprint.json') }}

      - name: Cache webOS SDK
        uses: actions/cache@v5
        with:
          path: .local/webos-sdk
          key: webos-sdk-${{ runner.os }}-${{ hashFiles('scripts/toolchain/install-webos-sdk.sh') }}

      - name: Install host packages
        run: mise run host-setup -- --quiet

      - name: Install webOS SDK
        run: mise run sdk-install

      - name: Check
        run: mise run check

      - name: Build
        run: mise run build-webos
